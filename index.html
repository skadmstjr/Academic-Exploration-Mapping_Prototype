<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>학문탐색 지도</title>
<style>
html,body{margin:0;height:100%;font-family:Arial,"Noto Sans KR","Malgun Gothic",sans-serif;background:#eef3f4;color:#173b48}#loading{height:100%;display:grid;place-items:center;text-align:center}small{color:#6e7d83;line-height:1.7}
</style>
</head>
<body>
<div id="loading"><div><b>학문탐색 지도를 불러오는 중...</b><br><small>Prototype v7</small></div></div>
<script>
(async()=>{
 try{
   const files=["v7-1.txt","v7-2.txt","v7-3.txt","v7-4.txt"];
   const parts=await Promise.all(files.map(async f=>{
      const r=await fetch(f+"?v=7",{cache:"no-store"});
      if(!r.ok) throw new Error(f+" "+r.status);
      return (await r.text()).trim();
   }));
   const b64=parts.join("");
   const raw=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
   if(!("DecompressionStream" in window)) throw new Error("최신 Chrome 또는 Edge에서 열어주세요.");
   const ds=new DecompressionStream("gzip");
   const decompressed=await new Response(new Blob([raw]).stream().pipeThrough(ds)).arrayBuffer();
   const html=new TextDecoder("utf-8").decode(decompressed);
   document.open();document.write(html);document.close();
 }catch(e){
   document.getElementById("loading").innerHTML="<div><b>불러오기에 실패했어요.</b><br><small>"+String(e.message||e)+"<br>새로고침하거나 최신 Chrome/Edge에서 열어주세요.</small></div>";
 }
})();
</script>
</body>
</html>
